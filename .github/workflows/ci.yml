# Runs every test on each push and pull request. The site is only published when they all pass, once the repository's
# Pages source is set to "GitHub Actions" and the repository variable DEPLOY_VIA_ACTIONS is set to true (Settings, Pages
# and Settings, Secrets and variables, Actions). Until then this only reports pass or fail and the site is published as before.
name: Tests and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python tests (the app's files and the sync server)
        run: python3 -m unittest discover -s tests

      - name: Browser tests (the page's own test suites, run in headless Chrome)
        run: |
          python3 -m http.server 8000 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=180000 \
            --dump-dom http://localhost:8000/tests/tests.html > tests-result.html
          grep -o '<title>[^<]*</title>' tests-result.html
          grep -q '<title>Budget tests - OK [0-9]*/[0-9]*</title>' tests-result.html

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.DEPLOY_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish only the app's files (not the tests, the server or the notes)
        run: |
          mkdir site
          cp index.html style.css app.js sw.js manifest.json site/
          cp -r icons site/icons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

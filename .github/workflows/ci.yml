# Runs every test on each push and pull request. The site is only published when they all pass, once the repository's
# Pages source is set to "GitHub Actions" and the repository variable DEPLOY_VIA_ACTIONS is set to true (Settings, Pages
# and Settings, Secrets and variables, Actions). Until then this only reports pass or fail and the site is published as before.
name: Tests and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python tests (the app's files and the sync server)
        run: python3 -m unittest discover -s tests

      # The page's own test suites run in real time (about a minute), so Chrome is left running and its tab title is
      # read until it says OK or FAIL: tests/tests.html ends the title with the result, for example "OK 761/761".
      - name: Browser tests (the page's own test suites, run in headless Chrome)
        run: |
          python3 -m http.server 8000 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 \
            http://localhost:8000/tests/tests.html > /dev/null 2>&1 &
          for i in $(seq 1 120); do
            title=$(curl -s http://localhost:9222/json | python3 -c "import sys, json; print(' '.join(t['title'] for t in json.load(sys.stdin) if t['type'] == 'page'))" 2>/dev/null || true)
            echo "after $((i * 2))s: $title"
            case "$title" in
              *"Budget tests - OK"*) exit 0 ;;
              *"Budget tests - FAIL"*) exit 1 ;;
            esac
            sleep 2
          done
          echo "The browser tests did not finish in four minutes"
          exit 1

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.DEPLOY_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish only the app's files (not the tests, the server or the notes)
        run: |
          mkdir site
          cp index.html style.css app.js sw.js manifest.json site/
          cp -r icons site/icons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
